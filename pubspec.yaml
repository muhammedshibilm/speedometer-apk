name: speedy
description: "Offline GPS speedometer with trip history"
publish_to: 'none'

version: 1.1.5+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GPS
  geolocator: ^14.0.2

  # UI
  google_fonts: ^6.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_mobile_ads: ^7.0.0
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.2
  vibration: ^2.0.1
  audioplayers: ^6.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  package_info_plus: ^9.0.0
  tutorial_coach_mark: ^1.3.3
  shared_preferences: ^2.5.2

  # Camera alerts & behavior tracking (new)
  http: ^1.2.0
  sensors_plus: ^6.0.1
  flutter_local_notifications: ^18.0.0
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0  
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  analyzer: ^6.4.1

  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/icon.png
  adaptive_icon_background: "#ffffff"

  


flutter:
  uses-material-design: true
  assets:
    - assets/audio/
